# ---------------------------------------------------------------------------
# lowlighter/metrics - renders assets/metrics.svg for the profile README.
#
# SETUP (required, otherwise this workflow just skips itself):
#   1. Create a *classic* Personal Access Token at
#        https://github.com/settings/tokens  ->  "Generate new token (classic)"
#      with the single scope:  public_repo
#      (no expiration, or remember to rotate it).
#   2. Add it to this repository under
#        Settings > Secrets and variables > Actions > New repository secret
#      Name:  METRICS_TOKEN
#      Value: <the token from step 1>
#
# The default GITHUB_TOKEN is NOT enough - metrics needs a PAT to read
# cross-repository statistics.
#
# Don't want this? Simply delete this file - nothing else depends on it.
# While METRICS_TOKEN is missing the workflow runs green and skips the render
# step (see the "check-secret" step below), so it never breaks the Actions tab.
# ---------------------------------------------------------------------------
name: metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Secrets cannot be used in a job-level `if:` expression, so the guard
      # lives in a step: it exports has_token=true/false as a step output and
      # every later step is gated on it.
      - name: Check for METRICS_TOKEN
        id: check-secret
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::METRICS_TOKEN is not set - skipping metrics generation. See the comment at the top of .github/workflows/metrics.yml."
          fi

      - name: Generate metrics
        if: steps.check-secret.outputs.has_token == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: secoolioo
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Berlin
          config_display: large
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, scss
          plugin_languages_details: bytes-size, percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_wakatime: no
