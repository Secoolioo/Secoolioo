<stop offset="1" stop-color="#16d67a" stop-opacity="0"/>
</linearGradient>
<filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
<feGaussianBlur stdDeviation="3" result="b">
<animate attributeName="stdDeviation" values="2.1;5.4;2.1" dur="2.7s" repeatCount="indefinite"/>
</feGaussianBlur>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="1.6" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
