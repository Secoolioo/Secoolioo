<radialGradient id="vig" cx="50%" cy="50%" r="66%">
<stop offset="0" stop-color="#030806" stop-opacity="0"/>
<stop offset=".62" stop-color="#030806" stop-opacity=".35"/>
<stop offset="1" stop-color="#030806" stop-opacity=".96"/>
</radialGradient>
<radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#16d67a" stop-opacity=".34"/>
<stop offset=".55" stop-color="#16d67a" stop-opacity=".08"/>
<stop offset="1" stop-color="#16d67a" stop-opacity="0"/>
