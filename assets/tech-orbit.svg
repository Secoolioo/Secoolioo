<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="460" viewBox="0 0 900 460" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title>Tech stack orbit</title>
<style>
.blink{animation:bl 1.9s steps(1,end) infinite}
@keyframes bl{0%,44%{opacity:1}45%,58%{opacity:.1}59%,100%{opacity:1}}
.flick{animation:fk 5.7s ease-in-out infinite}
@keyframes fk{0%,100%{opacity:.75}37%{opacity:.95}52%{opacity:.35}68%{opacity:.85}}
.scan{animation:sc 9.3s linear infinite}
@keyframes sc{from{transform:translateY(-80px)}to{transform:translateY(470px)}}
.np{animation:np 4.3s ease-in-out infinite}
@keyframes np{0%,100%{stroke-opacity:.95}50%{stroke-opacity:.42}}
.halo{animation:hl 6.1s ease-in-out infinite}
@keyframes hl{0%,100%{opacity:.16}50%{opacity:.05}}
.dim{animation:dm 7.9s ease-in-out infinite}
@keyframes dm{0%,100%{opacity:.5}50%{opacity:.22}}
</style>
<defs>
