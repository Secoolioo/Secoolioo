    @keyframes cu7{0%{opacity:0}7.1795%{opacity:1}8.2051%{opacity:0}100%{opacity:0}}
    @keyframes cu8{0%{opacity:0}8.2051%{opacity:1}9.2308%{opacity:0}100%{opacity:0}}
    @keyframes cu9{0%{opacity:0}9.2308%{opacity:1}10.2564%{opacity:0}100%{opacity:0}}
    @keyframes cu10{0%{opacity:0}10.2564%{opacity:1}11.2821%{opacity:0}100%{opacity:0}}
    @keyframes cu11{0%{opacity:0}11.2821%{opacity:1}12.3077%{opacity:0}100%{opacity:0}}
    @keyframes cu12{0%{opacity:0}12.3077%{opacity:1}13.3333%{opacity:0}100%{opacity:0}}
    @keyframes cu13{0%{opacity:0}13.3333%{opacity:1}100%{opacity:1}}

    @keyframes pulse { 0% { opacity: 1 } 50% { opacity: .25 } 100% { opacity: 1 } }
    .dot { animation: pulse 1.6s ease-in-out infinite; }

    @keyframes brk { 0% { opacity: .22 } 50% { opacity: .9 } 100% { opacity: .22 } }
    .br { fill: none; stroke: #16d67a; stroke-width: 2; animation: brk 3.7s ease-in-out infinite; }
    .br0 { animation-delay: -0.4s; }
    .br1 { animation-delay: -1.3s; }
    .br2 { animation-delay: -2.3s; }
    .br3 { animation-delay: -3.1s; }

    @keyframes sigin {
      0%   { opacity: 0; transform: translateX(-18px) }
      7%   { opacity: 1; transform: translateX(0) }
      100% { opacity: 1; transform: translateX(0) }
    }
    .sig { animation: sigin 12s cubic-bezier(.16,1,.3,1) infinite; }
    .g0 { animation-delay: -7.40s; }
    .g1 { animation-delay: -7.62s; }
    .g2 { animation-delay: -7.84s; }
    .g3 { animation-delay: -8.06s; }
    .g4 { animation-delay: -8.28s; }

    @keyframes blink { 0% { opacity: 1 } 50% { opacity: 1 } 51% { opacity: 0 } 100% { opacity: 0 } }
    .cur { animation: blink 1.1s steps(1, end) infinite; }

    @keyframes flick { 0% { opacity: .55 } 43% { opacity: .8 } 71% { opacity: .45 } 100% { opacity: .55 } }
    .flick { animation: flick 5.1s ease-in-out infinite; }
  ]]></style>
