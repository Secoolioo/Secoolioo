<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="GitHub activity HUD">
  <title>github.com/Secoolioo live HUD</title>
  <defs>
    <clipPath id="panelClip">
      <rect x="8" y="8" width="1184" height="404" rx="14"/>
    </clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#0d2a1c"/>
    </pattern>
    <linearGradient id="scanA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dffa6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4dffa6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#4dffa6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#4dffa6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .cu {
      animation-duration: 12s;
      animation-iteration-count: infinite;
      animation-timing-function: steps(1, end);
      animation-fill-mode: both;
    }
    .d0 { animation-delay: -3.0s; }
    .d1 { animation-delay: -3.4s; }
    .d2 { animation-delay: -3.9s; }
    .d3 { animation-delay: -4.3s; }
